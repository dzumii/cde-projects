name: dbt CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci_validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt
        run: pip install dbt-databricks
      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          marketing_data_platform:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_CI_TOKEN }}
                catalog: marketing_dev
                schema: ci
                threads: 4
          EOF
      - name: dbt deps
        run: dbt deps
      - name: dbt debug
        run: dbt debug --target ci
      - name: dbt compile
        run: dbt compile --target ci
      - name: dbt run (staging only in CI)
        run: dbt run --target ci --select staging
      - name: dbt test
        run: dbt test --target ci

  production_deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt
        run: pip install dbt-databricks
      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          marketing_data_platform:
            target: prod
            outputs:
              prod:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_PROD_TOKEN }}
                catalog: marketing_prod
                schema: marts
                threads: 4
          EOF
      - name: dbt deps
        run: dbt deps
      - name: dbt run (production)
        run: dbt run --target prod
      - name: dbt test (production)
        run: dbt test --target prod