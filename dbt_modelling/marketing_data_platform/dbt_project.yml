flags:
  require_explicit_package_overrides_for_builtin_materializations: false

name: 'marketing_data_platform'
version: '1.0.0'
config-version: 2
profile: 'marketing_data_platform'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]



models:
  marketing_data_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    marts:
      +materialized: incremental
      +schema: marts
      +incremental_strategy: merge
      +unique_key: ['date', 'platform', 'campaign_id', 'ad_id']
      +on_schema_change: append_new_columns
  elementary:
    +schema: elementary

  
    