version: 2
models:
  - name: stg_facebook_ads
    description: "Facebook ads with enriched campaign, adgroup, account names"
    columns:
      - name: ad_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: spend
        tests:
          - not_null
      - name: platform
        tests:
          - accepted_values:
              arguments:
                values: ['facebook']

  - name: stg_snapchat_ads
    description: "Snapchat ads with enriched campaign, adgroup names"
    columns:
      - name: ad_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: spend
        tests:
          - not_null
      - name: platform
        tests:
          - accepted_values:
              arguments:
                values: ['snapchat']